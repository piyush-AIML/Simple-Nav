<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body { margin: 0; font-family: sans-serif; }
      video { display: block; width: 100%; min-height: 300px; max-height: 720px; object-fit: cover; background: #111; border-radius: 6px; }
      button { margin-top: 12px; padding: 12px 20px; cursor: pointer; font-size: 16px; font-weight: 600; }
      label { display: block; margin-top: 12px; font-size: 14px; }
      #status { margin: 8px 0; color: #666; }
      #error { color: #b00020; }
    </style>
  </head>
  <body>
    <div id="status">Requesting rear camera…</div>
    <video id="preview" autoplay playsinline></video>
    <button id="capture" type="button" disabled>Take Photo</button>
    <label><input id="auto" type="checkbox" checked /> Auto-capture every 2 seconds</label>
    <div id="error"></div>
    <canvas id="canvas" hidden></canvas>

    <script>
      const video = document.getElementById("preview");
      const capture = document.getElementById("capture");
      const status = document.getElementById("status");
      const error = document.getElementById("error");
      const canvas = document.getElementById("canvas");
      const auto = document.getElementById("auto");
      let stream;
      let autoTimer;

      // Keep the component self-contained. This avoids relying on a CDN that
      // may be blocked when the Streamlit app is opened on a phone/network.
      const component = {
        setComponentReady() {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:componentReady",
            apiVersion: 1,
          }, "*");
        },
        setFrameHeight(height) {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setFrameHeight",
            height,
          }, "*");
        },
        setComponentValue(value) {
          window.parent.postMessage({
            isStreamlitMessage: true,
            type: "streamlit:setComponentValue",
            value: { type: "json", value: JSON.stringify(value) },
          }, "*");
        },
      };

      function resize() {
        component.setFrameHeight(Math.max(document.body.scrollHeight, 430));
      }

      function capturePhoto() {
        if (!video.videoWidth || !video.videoHeight) return;
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);
        component.setComponentValue(canvas.toDataURL("image/jpeg", 0.9));
      }

      async function startCamera() {
        try {
          // exact prevents silently falling back to the front camera.
          if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
            throw new Error("Camera access requires HTTPS (or localhost). Open the app using https:// or localhost.");
          }
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false,
          });
          video.srcObject = stream;
          capture.disabled = false;
          status.textContent = "Rear camera ready";
          video.addEventListener("loadedmetadata", resize, { once: true });
          autoTimer = window.setInterval(() => {
            if (auto.checked) capturePhoto();
          }, 2000);
          resize();
        } catch (err) {
          status.textContent = "Rear camera unavailable";
          error.textContent = "Allow camera access, use HTTPS/localhost, and make sure this device has a rear camera. " + err.message;
          resize();
        }
      }

      capture.addEventListener("click", () => {
        capturePhoto();
      });

      window.addEventListener("beforeunload", () => {
        if (stream) stream.getTracks().forEach((track) => track.stop());
        if (autoTimer) window.clearInterval(autoTimer);
      });

      component.setComponentReady();
      startCamera();
    </script>
  </body>
</html>
